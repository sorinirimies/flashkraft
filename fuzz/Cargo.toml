[package]
name = "flashkraft-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
flashkraft-core = { path = "../crates/flashkraft-core" }
serde = { version = "1", features = ["derive"] }
flashkraft-tui = { path = "../crates/flashkraft-tui" }
flashkraft = { path = "../crates/flashkraft-gui" }
ratatui = "*"
crossterm = "*"
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1"

# Not part of the main workspace (needs nightly).
[workspace]

[[bin]]
name = "settings_parse"
path = "fuzz_targets/settings_parse.rs"
test = false
doc = false

[[bin]]
name = "compatibility"
path = "fuzz_targets/compatibility.rs"
test = false
doc = false

[[bin]]
name = "version_compare"
path = "fuzz_targets/version_compare.rs"
test = false
doc = false

[[bin]]
name = "dedupe_devices"
path = "fuzz_targets/dedupe_devices.rs"
test = false
doc = false

[[bin]]
name = "web_validate"
path = "fuzz_targets/web_validate.rs"
test = false
doc = false

[[bin]]
name = "web_host"
path = "fuzz_targets/web_host.rs"
test = false
doc = false

[[bin]]
name = "tui_keys"
path = "fuzz_targets/tui_keys.rs"
test = false
doc = false

[[bin]]
name = "gui_update"
path = "fuzz_targets/gui_update.rs"
test = false
doc = false

[[bin]]
name = "web_browse"
path = "fuzz_targets/web_browse.rs"
test = false
doc = false
