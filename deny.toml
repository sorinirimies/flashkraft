# cargo-deny configuration: `cargo deny check`
[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # paste: unmaintained; transitive via iced/wgpu GUI stack, no fix available.
    "RUSTSEC-2024-0436",
    # ttf-parser: unmaintained; transitive via iced/cosmic-text stack.
    "RUSTSEC-2026-0192",
    # zbus_names/zvariant/zvariant_derive: unmaintained; transitive via
    # iced_winit -> mundy -> zbus, no safe upgrade available.
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0372",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "Unlicense",
    "WTFPL",
    "CC0-1.0",
    "0BSD",
    "MIT-0",
    "NCSA",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "GPL-3.0",
    "AGPL-3.0",
]

confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
