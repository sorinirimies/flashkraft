[advisories]
yanked = "deny"
# Unmaintained crates deep in the Iced GUI stack; nothing to upgrade to here.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste: via iced_wgpu → wgpu → metal" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: via iced → cosmic-text → fontdb" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant: via iced_winit → mundy → zbus" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: via iced_winit → mundy → zbus" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: via iced_winit → mundy → zbus" },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils: via iced → iced_futures → wasmtimer (web timers); its latest release still depends on it" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "BSL-1.0",
  # libfuzzer-sys bundles LLVM code (NCSA); webpki-roots ships the Mozilla CA data (CDLA).
  "NCSA", "CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
