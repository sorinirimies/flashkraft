name: Release

on:
  push:
    tags:
      - "v*"
  # Manual fallback — trigger from the Gitea Actions UI if the tag push
  # ever silently skips or a re-run is needed without re-pushing the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.5.0) — must already exist on the repo"
        required: true
        default: ""

permissions:
  contents: write
  packages: write

# One release run at a time per tag.  Re-pushing the same tag cancels the
# previous run instead of queuing a duplicate.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 0. Validate tag ──────────────────────────────────────────────────────────
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve and validate tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          echo "Resolved tag: ${TAG}"

          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Tag '${TAG}' does not match vX.Y.Z — aborting."
            exit 1
          fi

          VERSION="${TAG#v}"
          echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "✅ Tag ${TAG} (version ${VERSION}) is valid."

  # ── 1. Quality gate ──────────────────────────────────────────────────────────
  test:
    name: Test & lint
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Linux GUI system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libssl-dev

      - name: Install Rust stable (rustfmt + clippy + cross targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu,x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy (workspace)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -A deprecated

      - name: Run tests (workspace)
        run: cargo test --workspace --all-features

      # ── Cross-compile checks ─────────────────────────────────────────────────
      - name: Install mingw-w64 (for Windows cross-check)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mingw-w64

      - name: cargo check core — x86_64-pc-windows-gnu
        run: cargo check -p flashkraft-core --target x86_64-pc-windows-gnu

      - name: cargo check core — x86_64-apple-darwin
        run: cargo check -p flashkraft-core --target x86_64-apple-darwin

      - name: cargo check core — aarch64-apple-darwin
        run: cargo check -p flashkraft-core --target aarch64-apple-darwin

  # ── 2. Build all targets + create release (single job) ───────────────────────
  # Gitea runners do not support actions/upload-artifact@v4 / download-artifact@v4
  # (they require the GitHub artifact backend).  Building all targets in a single
  # job avoids cross-job artifact passing entirely.
  build-and-release:
    name: Build & Release
    needs: [validate, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      # ── System libraries ─────────────────────────────────────────────────────
      - name: Install Linux GUI system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libssl-dev

      # ── Cross-compilation toolchains (best-effort) ──────────────────────────
      - name: Install musl tools
        id: musl
        run: |
          if sudo apt-get install -y --no-install-recommends musl-tools; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️  musl-tools not available — skipping musl build."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install aarch64 cross-compilation toolchain
        id: aarch64
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update -qq || true
          if sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            # arm64 GUI libraries are best-effort
            sudo apt-get install -y --no-install-recommends \
              libxkbcommon-dev:arm64 \
              libx11-dev:arm64 \
              libwayland-dev:arm64 \
              libfontconfig1-dev:arm64 || true
          else
            echo "⚠️  aarch64 cross-toolchain not available — skipping aarch64 build."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Rust toolchain ───────────────────────────────────────────────────────
      - name: Install Rust stable + targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,x86_64-unknown-linux-musl,aarch64-unknown-linux-gnu

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Set up cross-linker env (aarch64)
        if: steps.aarch64.outputs.available == 'true'
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Create dist directory
        run: mkdir -p dist

      # ── Build: x86_64-unknown-linux-gnu (always) ────────────────────────────
      - name: Build x86_64-unknown-linux-gnu
        run: |
          echo "── Building x86_64-unknown-linux-gnu ──"
          cargo build --release -p flashkraft-tui --target x86_64-unknown-linux-gnu
          cargo build --release -p flashkraft     --target x86_64-unknown-linux-gnu
          cp target/x86_64-unknown-linux-gnu/release/flashkraft-tui dist/flashkraft-tui-x86_64-unknown-linux-gnu
          cp target/x86_64-unknown-linux-gnu/release/flashkraft     dist/flashkraft-gui-x86_64-unknown-linux-gnu
          echo "✅ x86_64-unknown-linux-gnu done."

      # ── Build: x86_64-unknown-linux-musl (if musl-tools available) ──────────
      - name: Build x86_64-unknown-linux-musl
        if: steps.musl.outputs.available == 'true'
        run: |
          echo "── Building x86_64-unknown-linux-musl (TUI only) ──"
          cargo build --release -p flashkraft-tui --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/flashkraft-tui dist/flashkraft-tui-x86_64-unknown-linux-musl
          echo "✅ x86_64-unknown-linux-musl done."

      - name: Skip notice (musl)
        if: steps.musl.outputs.available != 'true'
        run: echo "⏭️  Skipping x86_64-unknown-linux-musl — musl-tools not available."

      # ── Build: aarch64-unknown-linux-gnu (if cross-toolchain available) ─────
      - name: Build aarch64-unknown-linux-gnu
        if: steps.aarch64.outputs.available == 'true'
        run: |
          echo "── Building aarch64-unknown-linux-gnu ──"
          cargo build --release -p flashkraft-tui --target aarch64-unknown-linux-gnu
          cargo build --release -p flashkraft     --target aarch64-unknown-linux-gnu
          cp target/aarch64-unknown-linux-gnu/release/flashkraft-tui dist/flashkraft-tui-aarch64-unknown-linux-gnu
          cp target/aarch64-unknown-linux-gnu/release/flashkraft     dist/flashkraft-gui-aarch64-unknown-linux-gnu
          echo "✅ aarch64-unknown-linux-gnu done."

      - name: Skip notice (aarch64)
        if: steps.aarch64.outputs.available != 'true'
        run: echo "⏭️  Skipping aarch64-unknown-linux-gnu — cross-toolchain not available."

      # ── List built artifacts ─────────────────────────────────────────────────
      - name: List artifacts
        run: ls -lh dist/

      # ── Prepare release notes ────────────────────────────────────────────────
      - name: Install git-cliff
        run: cargo install git-cliff --locked

      - name: Install Nushell
        run: cargo install nu --locked

      - name: Prepare release (RELEASE_NOTES.md + CHANGELOG.md)
        run: nu scripts/release_prepare.nu ${{ needs.validate.outputs.tag }}

      # ── Create Gitea release ─────────────────────────────────────────────────
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*
            LICENSE
            README.md
            CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 3. Publish to crates.io ──────────────────────────────────────────────────
  # Order matters: core must be published first because gui and tui depend on it.
  publish:
    name: Publish to crates.io
    needs: [validate, build-and-release]
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CRATES_IO_TOKEN != '' }}
    steps:
      - name: Skip notice (no token)
        if: env.HAS_TOKEN != 'true'
        run: echo "⏭️  CRATES_IO_TOKEN is not configured — skipping crates.io publish."

      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Linux GUI system libraries
        if: env.HAS_TOKEN == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libssl-dev

      - name: Install Rust stable
        if: env.HAS_TOKEN == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        if: env.HAS_TOKEN == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Publish flashkraft-core
        if: env.HAS_TOKEN == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          if cargo info flashkraft-core@${VERSION} 2>/dev/null | grep -q "^flashkraft-core"; then
            echo "⏭️  flashkraft-core@${VERSION} already on crates.io — skipping."
          else
            echo "📦 Copying README.md into crates/flashkraft-core…"
            cp README.md crates/flashkraft-core/README.md
            echo "📦 Publishing flashkraft-core…"
            output=$(cargo publish -p flashkraft-core --allow-dirty 2>&1) && echo "$output" || {
              echo "$output"
              echo "$output" | grep -q "already exists" && echo "⏭️  Already published — skipping." || exit 1
            }
            echo "⏳ Waiting 30 s for the index to propagate…"
            sleep 30
          fi

      - name: Publish flashkraft (GUI)
        if: env.HAS_TOKEN == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          if cargo info flashkraft@${VERSION} 2>/dev/null | grep -q "^flashkraft"; then
            echo "⏭️  flashkraft@${VERSION} already on crates.io — skipping."
          else
            echo "📦 Copying README.md into crates/flashkraft-gui…"
            cp README.md crates/flashkraft-gui/README.md
            echo "📦 Publishing flashkraft (GUI)…"
            output=$(cargo publish -p flashkraft --allow-dirty 2>&1) && echo "$output" || {
              echo "$output"
              echo "$output" | grep -q "already exists" && echo "⏭️  Already published — skipping." || exit 1
            }
            echo "⏳ Waiting 20 s for the index to propagate…"
            sleep 20
          fi

      - name: Publish flashkraft-tui
        if: env.HAS_TOKEN == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          if cargo info flashkraft-tui@${VERSION} 2>/dev/null | grep -q "^flashkraft-tui"; then
            echo "⏭️  flashkraft-tui@${VERSION} already on crates.io — skipping."
          else
            echo "📦 Copying README.md into crates/flashkraft-tui…"
            cp README.md crates/flashkraft-tui/README.md
            echo "📦 Publishing flashkraft-tui…"
            output=$(cargo publish -p flashkraft-tui --allow-dirty 2>&1) && echo "$output" || {
              echo "$output"
              echo "$output" | grep -q "already exists" && echo "⏭️  Already published — skipping." || exit 1
            }
          fi
          echo "✅ Publish step complete."
