name: Release

on:
  push:
    tags:
      - "v*"
  # Manual fallback — trigger from the Gitea Actions UI if the tag push
  # ever silently skips or a re-run is needed without re-pushing the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.5.0) — must already exist on the repo"
        required: true
        default: ""

permissions:
  contents: write
  packages: write

# One release run at a time per tag.  Re-pushing the same tag cancels the
# previous run instead of queuing a duplicate.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 0. Validate tag ──────────────────────────────────────────────────────────
  # Resolve the effective tag from either a tag push or a manual dispatch, then
  # validate it matches vX.Y.Z before spending time on any build work.
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve and validate tag
        id: resolve
        run: |
          # For a tag push  → github.ref_name is the tag (e.g. "v0.5.0")
          # For manual runs → the user supplies it via the `tag` input
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          echo "Resolved tag: ${TAG}"

          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Tag '${TAG}' does not match vX.Y.Z — aborting."
            exit 1
          fi

          VERSION="${TAG#v}"
          echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "✅ Tag ${TAG} (version ${VERSION}) is valid."

  # ── 1. Quality gate ──────────────────────────────────────────────────────────
  test:
    name: Test & lint
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Linux GUI system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libssl-dev

      - name: Install Rust stable (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy (workspace)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -A deprecated

      - name: Run tests (workspace)
        run: cargo test --workspace --all-features

  # ── 2. Binary builds ─────────────────────────────────────────────────────────
  # Gitea runners only have native x86_64 toolchains — musl-tools and
  # aarch64 cross-compilers are not available.  Only the native GNU target
  # is built here; GitHub Actions handles the full matrix.
  build:
    name: Build — x86_64-unknown-linux-gnu
    needs: [validate, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Linux GUI system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libssl-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build TUI release binary
        run: cargo build --release -p flashkraft-tui

      - name: Build GUI release binary
        run: cargo build --release -p flashkraft

      - name: Stage release artifacts
        run: |
          mkdir -p dist
          TARGET="x86_64-unknown-linux-gnu"

          TUI_SRC="target/release/flashkraft-tui"
          TUI_DST="dist/flashkraft-tui-${TARGET}"
          cp "${TUI_SRC}" "${TUI_DST}"
          echo "Staged TUI: ${TUI_DST}"

          GUI_SRC="target/release/flashkraft"
          GUI_DST="dist/flashkraft-gui-${TARGET}"
          cp "${GUI_SRC}" "${GUI_DST}"
          echo "Staged GUI: ${GUI_DST}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: binaries-x86_64-unknown-linux-gnu
          path: dist/
          retention-days: 1

  # ── 3. Release ───────────────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install git-cliff
        run: cargo install git-cliff --locked

      - name: Install Nushell
        run: cargo install nu --locked

      - name: Prepare release (RELEASE_NOTES.md + CHANGELOG.md)
        run: nu scripts/release_prepare.nu ${{ needs.validate.outputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts/

      - name: Flatten artifact directories
        run: |
          cd artifacts
          for dir in */; do
            cp -r "$dir"* . 2>/dev/null || true
            rm -rf "$dir"
          done

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/*
            LICENSE
            README.md
            CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 4. Publish to crates.io ──────────────────────────────────────────────────
  # Order matters: core must be published first because gui and tui depend on it.
  # flashkraft (crates/flashkraft-gui) is published as `flashkraft` (the GUI binary).
  # flashkraft-tui is published as `flashkraft-tui` (the TUI binary).
  publish:
    name: Publish to crates.io
    needs: [validate, release]
    runs-on: ubuntu-latest
    # `secrets.*` cannot be used in a job-level `if:` on Gitea Actions —
    # the expression is evaluated before secrets are injected and always
    # resolves to the empty string, making the condition unparseable.
    # Instead we expose the secret as an env var and gate every publish
    # step with `if: env.HAS_TOKEN == 'true'`.
    env:
      HAS_TOKEN: ${{ secrets.CRATES_IO_TOKEN != '' }}
    steps:
      - name: Skip notice (no token)
        if: env.HAS_TOKEN != 'true'
        run: echo "⏭️  CRATES_IO_TOKEN is not configured — skipping crates.io publish."

      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Linux GUI system libraries
        if: env.HAS_TOKEN == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libssl-dev

      - name: Install Rust stable
        if: env.HAS_TOKEN == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        if: env.HAS_TOKEN == 'true'
        uses: Swatinem/rust-cache@v2

      # ── Step 1: publish flashkraft-core ─────────────────────────────────────
      # gui and tui both depend on this; it must hit the crates.io index first.
      - name: Publish flashkraft-core
        if: env.HAS_TOKEN == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          if cargo info flashkraft-core@${VERSION} 2>/dev/null | grep -q "^flashkraft-core"; then
            echo "⏭️  flashkraft-core@${VERSION} already on crates.io — skipping."
          else
            echo "📦 Copying README.md into crates/flashkraft-core…"
            cp README.md crates/flashkraft-core/README.md
            echo "📦 Publishing flashkraft-core…"
            output=$(cargo publish -p flashkraft-core --allow-dirty 2>&1) && echo "$output" || {
              echo "$output"
              echo "$output" | grep -q "already exists" && echo "⏭️  Already published — skipping." || exit 1
            }
            echo "⏳ Waiting 30 s for the index to propagate…"
            sleep 30
          fi

      # ── Step 2: publish flashkraft (GUI) ────────────────────────────────────
      - name: Publish flashkraft (GUI)
        if: env.HAS_TOKEN == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          if cargo info flashkraft@${VERSION} 2>/dev/null | grep -q "^flashkraft"; then
            echo "⏭️  flashkraft@${VERSION} already on crates.io — skipping."
          else
            echo "📦 Copying README.md into crates/flashkraft-gui…"
            cp README.md crates/flashkraft-gui/README.md
            echo "📦 Publishing flashkraft (GUI)…"
            output=$(cargo publish -p flashkraft --allow-dirty 2>&1) && echo "$output" || {
              echo "$output"
              echo "$output" | grep -q "already exists" && echo "⏭️  Already published — skipping." || exit 1
            }
            echo "⏳ Waiting 20 s for the index to propagate…"
            sleep 20
          fi

      # ── Step 3: publish flashkraft-tui ──────────────────────────────────────
      - name: Publish flashkraft-tui
        if: env.HAS_TOKEN == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          if cargo info flashkraft-tui@${VERSION} 2>/dev/null | grep -q "^flashkraft-tui"; then
            echo "⏭️  flashkraft-tui@${VERSION} already on crates.io — skipping."
          else
            echo "📦 Copying README.md into crates/flashkraft-tui…"
            cp README.md crates/flashkraft-tui/README.md
            echo "📦 Publishing flashkraft-tui…"
            output=$(cargo publish -p flashkraft-tui --allow-dirty 2>&1) && echo "$output" || {
              echo "$output"
              echo "$output" | grep -q "already exists" && echo "⏭️  Already published — skipping." || exit 1
            }
          fi
          echo "✅ Publish step complete."
