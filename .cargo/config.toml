# Keep debug builds small: full debuginfo grows target/ past 10 GB on GUI-sized
# workspaces. Line tables are enough for backtraces; set
# CARGO_PROFILE_DEV_DEBUG=2 when you need to step through code in a debugger.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# cargo update picks versions that build on the workspace rust-version (MSRV job).
[resolver]
incompatible-rust-versions = "fallback"
