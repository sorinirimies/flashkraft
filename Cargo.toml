[workspace]
members = [
    "crates/flashkraft-core",
    "crates/flashkraft-gui",
    "crates/flashkraft-tui",
    "crates/flashkraft-web",
]
resolver = "2"



[workspace.package]
version      = "2.3.7"
edition      = "2024"
rust-version = "1.90"
authors      = ["Sorin Irimies <sorinirimies@gmail.com>"]
license      = "MIT"
repository   = "https://github.com/sorinirimies/flashkraft"

# ── Shared dependency versions ─────────────────────────────────────────────────
# Pin versions here once; each crate's Cargo.toml references them with
# `{ workspace = true }` so there is a single source of truth.

[workspace.dependencies]
windows-sys  = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
] }
nix          = { version = "0.31", features = ["fs", "ioctl", "mount", "process", "user"] }
notify       = { version = "8.2.0", features = [] }

futures      = "0.3"
dirs         = "7.0"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
sha2         = "0.11"
tokio        = { version = "1", features = ["full"] }
anyhow       = "1"
tempfile     = "3"
reqwest      = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# GUI (Iced)
iced         = { version = "0.14.0", features = ["advanced", "canvas"] }
iced_fonts   = { version = "0.3.0", features = ["bootstrap"] }
rfd          = "0.17"

# TUI (Ratatui)
ratatui              = "0.30"
crossterm            = "0.29"
tui-file-explorer    = "4"
tui-slider   = "0.3.4"
tui-piechart = "1.0.2"
tui-checkbox = "0.4.6"
tui-spinner  = "0.4.19"
tui-nuances  = "0.1.10"

# CLI (clap) — web binary
clap         = { version = "4", features = ["derive", "env"] }

# Web (Topcoat)
topcoat      = "0.10"

# Internal crates
flashkraft-core = { path = "crates/flashkraft-core", version = "2.3.7" }

[workspace.lints.rust]
# Block-device ioctls and the Win32 API need unsafe: each use allows it with a reason.
unsafe_code = "deny"
missing_debug_implementations = "warn"
# `pub` only for what another crate uses; then dead_code finds the rest.
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto       = true
