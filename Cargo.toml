[workspace]
members = [
    "crates/flashkraft-core",
    "crates/flashkraft-gui",
    "crates/flashkraft-tui",
]
resolver = "2"



[workspace.package]
version      = "1.0.3"
edition      = "2021"
authors      = ["Sorin Irimies <sorinirimies@gmail.com>"]
license      = "MIT"
repository   = "https://github.com/sorinirimies/flashkraft"

# ── Shared dependency versions ─────────────────────────────────────────────────
# Pin versions here once; each crate's Cargo.toml references them with
# `{ workspace = true }` so there is a single source of truth.

[workspace.dependencies]
# Core / shared
sysinfo      = "0.38"
windows-sys  = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
] }
nix          = { version = "0.31", features = ["fs", "ioctl", "mount", "process", "user"] }
notify       = { version = "8.2.0", features = [] }

futures      = "0.3"
futures-timer = "3.0"
redb         = "4.0"
dirs         = "6.0"
sha2         = "0.10"
tokio        = { version = "1", features = ["full"] }
anyhow       = "1"
tempfile     = "3"

# GUI (Iced)
iced         = { version = "0.13.1", features = ["advanced", "canvas"] }
iced_aw      = "0.12.2"
iced_fonts   = { version = "0.1", features = ["bootstrap"] }
rfd          = "0.15"

# TUI (Ratatui)
ratatui              = "0.30"
crossterm            = "0.29"
tui-file-explorer    = "0.8.8"
tui-slider   = "0.3.2"
tui-piechart = "0.3.1"
tui-checkbox = "0.4.3"

# Internal crates
flashkraft-core = { path = "crates/flashkraft-core", version = "1.0.3" }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto       = true