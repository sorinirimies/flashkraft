name: Security

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main]
    paths: ["Cargo.lock", "Cargo.toml", "**/Cargo.toml", ".cargo/audit.toml", "fuzz/**", "crates/flashkraft-core/src/**"]
  pull_request:
    paths: ["Cargo.lock", "Cargo.toml", "**/Cargo.toml", ".cargo/audit.toml", "fuzz/**", "crates/flashkraft-core/src/**"]
  workflow_dispatch:

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust stable
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Generate lockfile (if absent)
        run: '[ -f Cargo.lock ] || cargo generate-lockfile'
      - name: Audit dependencies
        run: cargo audit

  fuzz:
    name: cargo fuzz (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust nightly
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz each target for 60s
        run: |
          for t in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run "$t" -- -max_total_time=60
          done
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
