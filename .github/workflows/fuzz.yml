name: Fuzz

on:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["fuzz/**", "crates/**/src/**", "Cargo.lock"]
  pull_request:
    paths: ["fuzz/**", "crates/**/src/**", "Cargo.lock"]
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: cargo fuzz (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install GUI system libraries (the GUI fuzz target links iced)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libwayland-dev libgl1-mesa-dev \
            libfontconfig1-dev libssl-dev
      - name: Install Rust nightly
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz each target for 60s (core, web guards, TUI keys, GUI reducer)
        run: |
          cargo +nightly fuzz list | while read -r t; do
            mkdir -p "$RUNNER_TEMP/corpus/$t"
            cargo +nightly fuzz run "$t" "$RUNNER_TEMP/corpus/$t" -- -max_total_time=60 < /dev/null
          done
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
