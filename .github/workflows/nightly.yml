name: Nightly dependency update

on:
  schedule:
    # Runs at 02:00 UTC every day
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  update-deps:
    name: Upgrade deps & quality gate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # A PAT lets the pushed commit re-trigger branch workflows.
          # Falls back to GITHUB_TOKEN if the secret is absent (push still
          # works but won't re-trigger CI on the branch).
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── System libraries (required by the Iced GUI crate) ────────────────────
      - name: Install Linux GUI system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libssl-dev

      # ── mingw-w64 (needed for the Windows cross-compile check) ───────────────
      - name: Install mingw-w64
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mingw-w64

      # ── Rust toolchain ────────────────────────────────────────────────────────
      - name: Install Rust stable (rustfmt + clippy + cross targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu,x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      # ── Tool dependencies ─────────────────────────────────────────────────────
      - name: Install cargo-edit (provides cargo upgrade)
        run: cargo install cargo-edit --locked

      - name: Install Nushell
        run: cargo install nu --locked

      # ── Nightly upgrade ───────────────────────────────────────────────────────
      # All logic lives in the Nu script:
      #   Phase 1 — cargo upgrade --workspace --incompatible allow
      #             rewrites version pins in [workspace.dependencies]
      #   Phase 2 — cargo update (syncs Cargo.lock)
      #   Quality gate — fmt → clippy → tests → cross-compile checks
      #   Commit strategy:
      #     gate passed  + Cargo.toml changed → commit Cargo.toml + Cargo.lock
      #     gate failed  + Cargo.toml changed → revert Cargo.toml, commit lock only, exit 1
      #     gate passed  + only Cargo.lock    → commit Cargo.lock only
      #     nothing changed                   → nothing to commit, exit 0
      - name: Run nightly dependency upgrade
        run: |
          nu scripts/upgrade_deps.nu \
            --bot-name  "github-actions[bot]" \
            --bot-email "github-actions[bot]@users.noreply.github.com" \
            --remote    "origin"
